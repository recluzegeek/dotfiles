# ==============================================================================
# ALACRITTY POWERHOUSE MINIMAL CONFIG FOR BACKEND DEV
# Path: ~/.config/alacritty/alacritty.toml
# ==============================================================================

[window]
padding = { x = 12, y = 12 }
dynamic_title = true
opacity = 0.95
blur = true
decorations = "Full"
startup_mode = "Maximized"

[scrolling]
history = 50000
multiplier = 3

[font]
# Current fallback layout. Swap strings below to test Iosevka later.
normal = { family = "Ubuntu Mono", style = "Regular" }
bold = { family = "Ubuntu Mono", style = "Bold" }
italic = { family = "Ubuntu Mono", style = "Italic" }
size = 14.0

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_timeout = 10

# ------------------------------------------------------------------------------
# TOKYO NIGHT COLORS
# ------------------------------------------------------------------------------
[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.normal]
black = "#32344a"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#444b6a"
red = "#ff7a93"
green = "#b9f27c"
yellow = "#ff9e64"
blue = "#7da6ff"
magenta = "#bb9af7"
cyan = "#0db9d7"
white = "#acb0d0"

# ------------------------------------------------------------------------------
# HINTS & KEYBINDINGS
# ------------------------------------------------------------------------------
[hints]
alphabet = "jkluiopytremwqazxcvbnm"
[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)\n[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
mouse = { enabled = true, mods = "None" }

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

