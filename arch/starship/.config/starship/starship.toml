format = """
$username\
$directory\
$rust\
$python\
$lua\
$nodejs\
$java\
$golang\
$aws\
$docker_context\
$fill\
$git_branch\
$git_status\
$jobs\
$cmd_duration\
$line_break\
$character"""

# 🚀 Username Block
[username]
show_always = true
style_user = "bold white"
format = "🚀 [$user]($style) in "

# 📁 Directory Block (Shows full paths relative to ~)
[directory]
style = 'bold cyan'
format = '📁 [$path]($style) '
truncation_length = 999
truncate_to_repo = false

# Node.js Block
[nodejs]
style = "bold green"
symbol = "󰎙 "
format = "via [$symbol$version]($style) "

# 🦀 Rust Language Block
[rust]
style = "bold red"
symbol = "🦀 "
format = "via [$symbol$version]($style) "

# 🐍 Python Language Block
[python]
style = "bold yellow"
symbol = "🐍 "
format = "via [$symbol$version]($style) "

# --- Git configuration (Pushed to the right edge via $fill) ---
[git_branch]
style = 'gray'
symbol = ' '
format = '[$symbol$branch](_style_)'

[git_status]
style = 'red'
format = ' ([$all_status$ahead_behind]($style))'

# --- Character Prompt Input ---
[character]
success_symbol = '[❯](purple) '
error_symbol = '[❯](red) '
